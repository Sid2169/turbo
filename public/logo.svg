<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Turbo</title>
  <desc id="desc">An electric-blue folded command mark on a vermilion-orange squircle with a subtle bevel.</desc>
  <defs>
    <path id="tile" d="M256 32C442 32 480 70 480 256S442 480 256 480 32 442 32 256 70 32 256 32Z"/>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFA35C"/>
      <stop offset=".4" stop-color="#F66A19"/>
      <stop offset="1" stop-color="#AD300C"/>
    </linearGradient>
  </defs>
  <use href="#tile" fill="#AA310F" transform="translate(0 6)"/>
  <use href="#tile" fill="url(#bevel)"/>
  <use href="#tile" fill="#F45B16" transform="translate(256 256) scale(.972) translate(-256 -256)"/>
  <!-- A folded ribbon: a command chevron and a forward-cut stem, unified into one silhouette. -->
  <path d="M135 146H285L379 240 235 384V276L285 226H215Z" fill="#0A43B8" transform="translate(0 5)"/>
